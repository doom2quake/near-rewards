[package]
name = "settlemint"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Settlemint: a self-settling event market for NEAR, milestone 1 settlement core."
repository = "https://github.com/doom2quake/settlemint-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.6.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.6.0", features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
